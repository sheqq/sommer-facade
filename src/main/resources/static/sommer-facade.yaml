swagger: "2.0"
info:
  title: sommer-facade
  description: REST API für sommer.de
  version: 1.0.0
basePath: /api/v1
consumes:
  - application/json
produces:
  - application/json

paths:
  /users:
    get:
      operationId: getAllUsers
      summary: Get all users
      responses:
        200:
          description: Liste aller Nutzer
          schema:
            type: array
            items:
              $ref: '#/definitions/User'
    post:
      operationId: createUser
      summary: Neuen Nutzer erstellen
      parameters:
        - in: body
          name: user
          required: true
          schema:
            $ref: '#/definitions/CreateUserRequest'
      responses:
        201:
          description: Nutzer erfolgreich erstellt
          schema:
            $ref: '#/definitions/User'
        400:
          description: Ungültige Eingabedaten
          schema:
            $ref: '#/definitions/Error'
        409:
          description: Nutzer existiert bereits
          schema:
            $ref: '#/definitions/Error'

  /users/{userId}:
    get:
      operationId: getUserById
      summary: Nutzer nach ID abrufen
      parameters:
        - in: path
          name: userId
          required: true
          type: integer
          format: int64
      responses:
        200:
          description: Nutzer gefunden
          schema:
            $ref: '#/definitions/User'
        404:
          description: Nutzer nicht gefunden
          schema:
            $ref: '#/definitions/Error'

    put:
      operationId: updateUser
      summary: Nutzer aktualisieren
      parameters:
        - in: path
          name: userId
          required: true
          type: integer
          format: int64
        - in: body
          name: user
          required: true
          schema:
            $ref: '#/definitions/UpdateUserRequest'
      responses:
        200:
          description: Nutzer erfolgreich aktualisiert
          schema:
            $ref: '#/definitions/User'
        400:
          description: Ungültige Eingabedaten
          schema:
            $ref: '#/definitions/Error'
        404:
          description: Nutzer nicht gefunden
          schema:
            $ref: '#/definitions/Error'

    delete:
      operationId: deleteUser
      summary: Nutzer löschen
      parameters:
        - in: path
          name: userId
          required: true
          type: integer
          format: int64
      responses:
        204:
          description: Nutzer erfolgreich gelöscht
        404:
          description: Nutzer nicht gefunden
          schema:
            $ref: '#/definitions/Error'

definitions:
  User:
    type: object
    required:
      - id
      - email
      - username
      - member
      - level
      - color
    properties:
      id:
        type: integer
        format: int64
        example: 1
      email:
        type: string
        format: email
        example: "max.mustermann@example.com"
      username:
        type: string
        example: "Max"
      member:
        type: array
        items:
          type: string
          format: date-time
        example: "Mustermann"
      level:
        type: integer
        example: 5
      color:
        type: string
        example: "#FF5733"

  CreateUserRequest:
    type: object
    required:
      - email
      - firstName
    properties:
      email:
        type: string
        format: email
        example: "max.mustermann@example.com"
      firstName:
        type: string
        example: "Max"
      lastName:
        type: string
        example: "Mustermann"

  UpdateUserRequest:
    type: object
    properties:
      email:
        type: string
        format: email
        example: "max.mustermann@example.com"
      username:
        type: string
        example: "Max"
      member:
        type: array
        items:
          type: string
          format: date-time
        example: "Mustermann"
      level:
        type: integer
        example: 5
      color:
        type: string
        example: "#FF5733"

  Error:
    type: object
    required:
      - code
      - message
    properties:
      code:
        type: integer
        example: 400
      message:
        type: string
        example: "Ungültige Eingabedaten"
      details:
        type: string
        example: "E-Mail-Adresse ist bereits vergeben"
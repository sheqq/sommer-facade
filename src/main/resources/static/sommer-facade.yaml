swagger: "2.0"
info:
  title: sommer-facade
  description: REST API für sommer.de
  version: 1.0.0
basePath: /api/v1
consumes:
  - application/json
produces:
  - application/json

paths:
  /users:
    get:
      operationId: getAllUsers
      summary: Get all users
      responses:
        200:
          description: Liste aller Nutzer
          schema:
            type: array
            items:
              $ref: '#/definitions/User'
    post:
      operationId: createUser
      summary: Neuen Nutzer erstellen (ohne id)
      parameters:
        - in: body
          name: user
          required: true
          schema:
            $ref: '#/definitions/CreateUserRequest'
      responses:
        201:
          description: Nutzer erfolgreich erstellt
          schema:
            $ref: '#/definitions/User'

  /users/{userId}:
    get:
      operationId: getUserById
      summary: Nutzer nach ID abrufen
      parameters:
        - in: path
          name: userId
          required: true
          type: string
      responses:
        200:
          description: Nutzer gefunden
          schema:
            $ref: '#/definitions/User'
        404:
          description: Nutzer nicht gefunden
    put:
      operationId: updateUser
      summary: Nutzer aktualisieren
      parameters:
        - in: path
          name: userId
          required: true
          type: string
        - in: body
          name: user
          required: true
          schema:
            $ref: '#/definitions/UpdateUserRequest'
      responses:
        200:
          description: Nutzer erfolgreich aktualisiert
          schema:
            $ref: '#/definitions/User'
        404:
          description: Nutzer nicht gefunden
    delete:
      operationId: deleteUser
      summary: Nutzer löschen
      parameters:
        - in: path
          name: userId
          required: true
          type: string
      responses:
        204:
          description: Nutzer erfolgreich gelöscht
        404:
          description: Nutzer nicht gefunden

definitions:
  UserAttributes:
    type: object
    properties:
      id:
        type: string
        readOnly: true
        example: "2347247625478"
      username:
        type: string
        example: "Max"
      member:
        type: array
        items:
          type: string
          format: date-time
        example: ["2025-08-27T12:34:56"]
      level:
        type: integer
        example: 5
      color:
        type: string
        example: "#FF5733"

  User:
    allOf:
      - $ref: '#/definitions/UserAttributes'
      - type: object
        required:
          - id
          - username
        properties: {}

  CreateUserRequest:
    allOf:
      - $ref: '#/definitions/UserAttributes'
      - type: object
        required:
          - -id
          - username
        properties: {}

  UpdateUserRequest:
    allOf:
      - $ref: '#/definitions/UserAttributes'
      - type: object
        properties: {}
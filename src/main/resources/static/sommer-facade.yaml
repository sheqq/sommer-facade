openapi: 3.1.0
info:
  title: sommer-facade
  description: REST API für sommer.de
  version: 1.0.0

servers:
  - url: /api/v1

tags:
  - name: user
    description: Operationen rund um Nutzer

paths:
  /users:
    get:
      tags: [user]
      operationId: getAllUsers
      summary: Get all users
      responses:
        '200':
          description: Liste aller Nutzer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags: [user]
      operationId: createUser
      summary: Neuen Nutzer erstellen (Client liefert id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: Nutzer erfolgreich erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: ID des Nutzers
        schema:
          type: string
    get:
      tags: [user]
      operationId: getUserById
      summary: Nutzer nach ID abrufen
      responses:
        '200':
          description: Nutzer gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Nutzer nicht gefunden
    put:
      tags: [user]
      operationId: updateUser
      summary: Nutzer aktualisieren (Body.id soll mit Pfad-ID übereinstimmen)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Nutzer erfolgreich aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Nutzer nicht gefunden
    delete:
      tags: [user]
      operationId: deleteUser
      summary: Nutzer löschen
      responses:
        '204':
          description: Nutzer erfolgreich gelöscht
        '404':
          description: Nutzer nicht gefunden

components:
  schemas:
    UserAttributes:
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: string
          example: "2347247625478"
        username:
          type: string
          example: "Max"
        member:
          type: array
          items:
            type: string
            format: date
          example: ["2025-08-27", "2025-09-01"]
        level:
          type: integer
          example: 5
        color:
          type: string
          example: "#FF5733"
    User:
      allOf:
        - $ref: '#/components/schemas/UserAttributes'
        - type: object
          properties: {}